<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会社概要 – TRAKON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1A1E2E;--orange:#E8622A;
  --bg:#F7F8FA;--text:#1A1E2E;--text-mid:#5A607A;--text-lt:#9BA3BF;--border:#E2E5EF;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
nav{background:var(--navy);height:64px;padding:0 64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-icon{width:32px;height:32px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:white;}
.nav-brand{font-size:18px;font-weight:700;color:white;letter-spacing:3px;}
.nav-sub{font-size:9px;color:rgba(255,255,255,.35);font-family:'DM Mono',monospace;letter-spacing:1.5px;margin-top:2px;}
.nav-back{font-size:13px;color:rgba(255,255,255,.5);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .15s;font-weight:500;}
.nav-back:hover{color:white;}
.page-hero{background:var(--navy);padding:56px 64px 64px;border-bottom:1px solid rgba(255,255,255,.06);}
.page-hero-inner{max-width:760px;margin:0 auto;}
.page-label{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:rgba(232,98,42,.7);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.page-label::before{content:'';width:20px;height:2px;background:var(--orange);opacity:.6;border-radius:1px;}
.page-title{font-size:36px;font-weight:700;color:white;letter-spacing:-1px;}
.content-wrap{max-width:760px;margin:0 auto;padding:64px 64px 120px;}
.company-table{width:100%;background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(26,30,46,.06);border:1px solid var(--border);}
.ct-row{display:grid;grid-template-columns:180px 1fr;border-bottom:1px solid var(--border);}
.ct-row:last-child{border-bottom:none;}
.ct-label{
  padding:24px 28px;
  font-size:12px;font-weight:700;color:var(--text-lt);
  font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;
  background:var(--bg);border-right:1px solid var(--border);
  display:flex;align-items:flex-start;
}
.ct-val{padding:24px 28px;font-size:15px;color:var(--text);line-height:1.75;}
.ct-val .note{font-size:13px;color:var(--text-lt);margin-left:10px;}
.ct-val a{color:var(--orange);text-decoration:none;}
.ct-val a:hover{text-decoration:underline;}
footer{background:var(--navy);border-top:1px solid rgba(255,255,255,.06);padding:36px 64px;display:flex;align-items:center;justify-content:space-between;}
.ft-logo{display:flex;align-items:center;gap:10px;}
.ft-icon{width:28px;height:28px;background:var(--orange);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:white;}
.ft-brand{font-size:15px;font-weight:700;color:white;letter-spacing:3px;}
.ft-copy{font-size:11px;color:rgba(255,255,255,.25);font-family:'DM Mono',monospace;}
.ft-links{display:flex;gap:24px;}
.ft-link{font-size:12px;color:rgba(255,255,255,.3);text-decoration:none;transition:color .15s;}
.ft-link:hover{color:rgba(255,255,255,.7);}
@media(max-width:768px){
  nav,.page-hero{padding-left:24px;padding-right:24px;}
  .content-wrap{padding:40px 24px 80px;}
  .ct-row{grid-template-columns:1fr;}
  .ct-label{border-right:none;border-bottom:1px solid var(--border);padding:14px 20px;}
  .ct-val{padding:16px 20px;}
  footer{flex-direction:column;gap:16px;text-align:center;padding:32px 24px;}
  .ft-links{justify-content:center;}
  .page-title{font-size:28px;}
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">
    <div class="nav-icon">T</div>
    <div>
      <div class="nav-brand">TRAKON</div>
      <div class="nav-sub">Keep the ball moving.</div>
    </div>
  </a>
  <a class="nav-back" href="/">← トップに戻る</a>
</nav>

<div class="page-hero">
  <div class="page-hero-inner">
    <div class="page-label">Company</div>
    <h1 class="page-title">会社概要</h1>
  </div>
</div>

<div class="content-wrap">
  <div class="company-table">

    <div class="ct-row">
      <div class="ct-label">会社名</div>
      <div class="ct-val">株式会社おさまるカンパニー</div>
    </div>

    <div class="ct-row">
      <div class="ct-label">代表取締役</div>
      <div class="ct-val">宮丸 長<span class="note">（Osa MIYAMARU）</span></div>
    </div>

    <div class="ct-row">
      <div class="ct-label">事業内容</div>
      <div class="ct-val">
        プロジェクト進行支援サービスの企画・開発・運営<br>
        Webに関する企画・制作・運用支援
      </div>
    </div>

    <div class="ct-row">
      <div class="ct-label">所在地</div>
      <div class="ct-val">埼玉県児玉郡神川町原新田21-20</div>
    </div>

    <div class="ct-row">
      <div class="ct-label">お問い合わせ</div>
      <div class="ct-val"><a href="/contact" style="color:var(--orange);text-decoration:none;">お問い合わせフォーム</a>よりご連絡ください。</div>
    </div>

  </div>
</div>

<footer>
  <div class="ft-logo">
    <div class="ft-icon">T</div>
    <div class="ft-brand">TRAKON</div>
  </div>
  <div class="ft-copy">Keep the ball moving.</div>
  <div class="ft-links">
    <a class="ft-link" href="/company">会社概要</a>
    <a class="ft-link" href="/terms">利用規約</a>
    <a class="ft-link" href="/privacy">プライバシーポリシー</a>
    <a class="ft-link" href="/commerce">特定商取引法に基づく表記</a>
    <a class="ft-link" href="/contact">お問い合わせ</a>
  </div>
  <div class="ft-copy">© 2026 株式会社おさまるカンパニー</div>
</footer>

</body>
</html>
